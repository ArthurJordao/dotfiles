# Roles — unknown names are silently inert, never an error:
#   server     long-lived hosted services
#   podman     rootless podman quadlets
#   gui        graphical session
#   gaming     used for games
#   minecraft  minecraft@ units + helper scripts
#   edge       Caddy, CoreDNS, cloudflared, /etc deploy
#   ddns       cloudflare-ddns service+timer

hosts:
  mars:
    roles: [server, podman, gui, gaming, minecraft, edge, ddns]
    services:
      - calibre-web-automated
      - immich
      - music
      - open-webui
      - shelfmark
      - teamspeak3

  Arthurs-MacBook-Pro:
    roles: [gui]
    services: []

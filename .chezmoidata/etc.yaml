# yaml-language-server: $schema=../schemas/etc.schema.json
#
# What this repo installs under /etc, in two namespaces.
#
#   roles:  keyed by the role that owns the group -- a purpose, so the files
#           follow the role when it moves between hosts. Prefer this.
#   hosts:  keyed by hostname, for a file that is about *this box* and nothing
#           else: hardware, a distro quirk. Never put a purpose here, or the
#           role gating withers into a per-host dumping ground.
#
# run_onchange_after_70-deploy-etc.sh.tmpl renders every `roles` group matching
# one of the host's roles, then this host's `hosts` group last, inlining each
# body from .chezmoitemplates/etc/.
#
# A `roles` key must name a role no darwin host carries, or the script runs
# `sudo install` on linux /etc paths on a Mac. `hosts` keys cannot do that.
#
# `dest` may carry {tunnel_id}: chezmoi does not re-template a data value, so it
# is substituted at render time. Same placeholder trick as binaries.yaml.
#
# Setup that is not a file -- the caddy system user, the CoreDNS self-signed
# cert, the resolved drop-in -- stays imperative in the script. This table
# covers files and units only.

etc:
  roles:
    edge:
      files:
        - {src: caddy/Caddyfile, dest: /etc/caddy/Caddyfile, mode: "644"}
        - {src: caddy/caddy.env, dest: /etc/caddy/caddy.env, mode: "600"}
        - {src: coredns/Corefile, dest: /etc/coredns/Corefile, mode: "644"}
        - {src: cloudflared/config.yml, dest: /etc/cloudflared/config.yml, mode: "644"}
        - {src: cloudflared/credentials.json, dest: "/etc/cloudflared/{tunnel_id}.json", mode: "600"}
        - {src: systemd/caddy.service, dest: /etc/systemd/system/caddy.service, mode: "644"}
        - {src: systemd/coredns.service, dest: /etc/systemd/system/coredns.service, mode: "644"}
        - {src: systemd/cloudflared.service, dest: /etc/systemd/system/cloudflared.service, mode: "644"}
        - {src: systemd/cloudflared-update.service, dest: /etc/systemd/system/cloudflared-update.service, mode: "644"}
        - {src: systemd/cloudflared-update.timer, dest: /etc/systemd/system/cloudflared-update.timer, mode: "644"}
      enable:  [caddy, coredns, cloudflared, cloudflared-update.timer]
      reload:  [caddy]
      restart: [coredns, cloudflared]
    # Unit name is Debian/networkd's. Keyed on `server`, not `podman`: a `podman`
    # group would start deploying /etc on mars too.
    server:
      files:
        - {src: systemd/networkd-wait-online-ipv4.conf,
           dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/zz-wait-for-ipv4.conf,
           mode: "644"}
      # Present for the daemon-reload; also clears the failed unit.
      enable: [systemd-networkd-wait-online]
    # Unit names below (smb, wsdd) are Arch's; another distro's may differ.
    samba:
      files:
        - {src: samba/smb.conf, dest: /etc/samba/smb.conf, mode: "644"}
        - {src: avahi/smb.service, dest: /etc/avahi/services/smb.service, mode: "644"}
      enable:  [avahi-daemon, smb, wsdd]
      restart: [smb, wsdd]

  hosts:
    # The modprobe and logind files take no enable/reload/restart -- modprobe
    # options apply at module load and logind config at reload, so both are
    # next-boot changes, and restarting logind kills the session. The x9pro
    # units below do take one; they are a unit, not a config file.
    #
    # The logind drop-in is declared per host rather than by role because its
    # trigger is the CachyOS image (it ships KillUserProcesses=True), and that
    # is neither a role nor visible in `distro: arch`. The roles both boxes
    # share are worse fits: `gui`/`dev` are carried by darwin neptune, `gaming`
    # matches only by coincidence, and `emulation` would drag in phobos, where
    # it is inert. Revisit if a third CachyOS host appears.
    mars:
      files:
        # The wifi dongle is mars's alone.
        - {src: modprobe.d/88x2bu.conf, dest: /etc/modprobe.d/88x2bu.conf, mode: "644"}
        - {src: logind/zz-keep-user-processes.conf,
           dest: /etc/systemd/logind.conf.d/zz-keep-user-processes.conf, mode: "644"}
        # The external disk is this box's, so it is keyed here and not by role.
        # Unit names are the escaped mount point and cannot be chosen.
        - {src: systemd/mnt-x9pro.mount,
           dest: /etc/systemd/system/mnt-x9pro.mount, mode: "644"}
        - {src: systemd/mnt-x9pro.automount,
           dest: /etc/systemd/system/mnt-x9pro.automount, mode: "644"}
      # The automount is the boot-started half; the .mount is pulled in on access.
      enable: [mnt-x9pro.automount]
    mercury:
      files:
        - {src: logind/zz-keep-user-processes.conf,
           dest: /etc/systemd/logind.conf.d/zz-keep-user-processes.conf, mode: "644"}

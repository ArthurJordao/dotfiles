# yaml-language-server: $schema=../schemas/hosts.schema.json
#
# Roles — unknown names are silently inert, never an error:
#   server     long-lived hosted services
#   podman     rootless podman quadlets
#   gui        graphical session
#   gaming     used for games
#   minecraft  minecraft@ units + helper scripts
#   sunshine   sunshine game-stream host (package + its user unit)
#   moonlight  moonlight client, i.e. streams *from* a sunshine host
#   emulation  syncthing + the shared EmuDeck library (see `syncthing.folders`)
#   edge       Caddy, CoreDNS, cloudflared, /etc deploy
#
# `os` and `distro` are what a template reads instead of .chezmoi.os — chezmoi's
# own value cannot be overridden, so simulate-host could not render another
# host's platform. `distro` is linux-only and picks the package family.
#
# quadlets/units/endpoints generate the Caddy, CoreDNS, cloudflared and
# gaming-mode configs. They are independent lists and nothing errors when they
# disagree. `syncthing.folders` is a fourth such list.
#
# `served_by` on an endpoint names the non-container service listening on that
# port. Without it, tools/check-consistency requires a quadlet to publish it.
#
# `managed: false` marks a host chezmoi is never applied to — it carries `user`
# and `ip` only, and exists here for the DNS records and the ssh config block.

domain: arthurjordao.dev

# Fleet-wide. Read by every quadlet that sets TZ.
timezone: America/Sao_Paulo

hosts:
  deimos:
    managed: false
    user: root
    ip:
      lan: 192.168.15.27
      tailscale: 100.94.29.100

  europa:
    managed: false
    user: root
    ip:
      lan: 192.168.15.22
      tailscale: 100.84.63.99

  mars:
    roles: [server, podman, gui, gaming, minecraft, sunshine, emulation, edge]
    os: linux
    distro: arch
    user: turisa
    ip:
      lan: 192.168.15.23
      tailscale: 100.127.50.55
    # Read off the host after its first syncthing start; empty omits it.
    syncthing_id: "34WVFBB-7BPUYSO-PIU3HJU-LQ7MA53-FIMPVUR-Q6YAKGI-DCTMY4D-VSTRKQB"

    storage:
      external: /mnt/x9pro

    quadlets:
      - calibre-web-automated
      - cloudflare-ddns
      - immich
      - music
      - shelfmark
      - teamspeak3

    units:
      # Every immich unit, not just the pod: starting immich-pod alone brings
      # up an empty pod (Requires= propagates stop, not start).
      - {name: immich-pod}
      - {name: immich-db}
      - {name: immich-valkey}
      - {name: immich-ml}
      - {name: immich-server}
      - {name: navidrome}
      - {name: slskd}
      - {name: soulsync}
      - {name: calibre-web-automated}
      - {name: cloudflare-ddns}
      - {name: shelfmark}
      - {name: teamspeak3}
      - {name: syncthing}
      - {name: olivetin, stop_for_gaming: false}
      - {name: sunshine, stop_for_gaming: false}

    endpoints:
      - {name: books, port: 8083, public: true}
      - {name: dash, port: 1337, served_by: olivetin}
      - {name: dns, port: 8053, scheme: https, tls_insecure: true, log: false, served_by: coredns}
      - {name: immich, port: 2283, public: true}
      - {name: minecraft, ddns: true}
      - {name: music, port: 4533}
      - {name: shelfmark, port: 8084}
      - {name: slskd, port: 5030}
      - {name: soulsync, port: 8008}
      # Config UI only — moonlight talks straight to the host, not via Caddy.
      - {name: sunshine, port: 47990, scheme: https, tls_insecure: true, served_by: sunshine}

  mercury:
    roles: [gui, gaming, moonlight, emulation]
    os: linux
    distro: arch
    user: arthur
    ip:
      lan: 192.168.15.28
      tailscale: 100.121.125.41
    syncthing_id: "X2U3R6Y-HUJD53W-YLYDY42-TEWFQ5O-O5VBTL4-3SJ3JIL-UEEKXZJ-UIBXPQB"
    quadlets: []
    units: []
    endpoints: []

  neptune:
    roles: [gui]
    os: darwin
    user: arthurjordao
    ip:
      lan: 192.168.15.20
      tailscale: 100.123.133.58
    quadlets: []
    units: []
    endpoints: []

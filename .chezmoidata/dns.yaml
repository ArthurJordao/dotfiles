# yaml-language-server: $schema=../schemas/dns.schema.json
#
# DNS filtering. `upstream` has two consumers -- blocky's upstream and CoreDNS's
# fallback -- so the resolver is declared once and they cannot disagree.
dns:
  upstream:
    servername: cloudflare-dns.com
    ips: [1.1.1.1, 1.0.0.1]

  filter:
    # Host-side ports. blocky's own listeners stay on the image's 53 and 4000.
    #
    # Not 5353: that is mDNS, and avahi's wildcard 0.0.0.0:5353 socket swallows
    # packets aimed at a stopped blocky instead of the kernel refusing them, so
    # every query waits out CoreDNS's 2s timeout rather than failing over at
    # once. Any replacement must have no other listener.
    port: 5533
    api_port: 4000

  # hosts format and Adblock Plus syntax are both fine -- blocky parses either.
  # loading.strategy is failOnError, so every URL here has to be reachable when
  # blocky starts, or it refuses to start (DNS keeps working, unfiltered).
  blocklists:
    - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    - https://big.oisd.nl
    # These query params are required; without them it serves an HTML page.
    - "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"

  # Domains exempted from every list.
  allow: []

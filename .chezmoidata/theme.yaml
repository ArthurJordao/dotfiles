# yaml-language-server: $schema=../schemas/theme.schema.json
#
# Switch the whole fleet by editing `active`, then `just apply` and restart the
# terminal. Colors live in palettes.yaml (generated); this file only names things.
#
# Six consumers take a name because their upstream ports encode work 16 colors
# cannot carry. Only FZF and lazygit are generated from `palette`.
#
# `homepage` takes light/dark plus one of its own fixed palette names -- it has
# no way to accept hex, so the base16 colors cannot reach it.
#
# `bat` must be a name bat ships built in (`bat --list-themes`) -- an unknown
# name only warns, then falls back to a dark default.
#
# Adding a theme needs a palette (tools/fetch-palette) and a .theme the fish
# plugin ships. `fish` is the path under ~/.config/fish/themes without the
# extension: catppuccin keeps the flat themes in static/, and the top-level
# names are fish 4.3 adaptive variants that pick their own light/dark.

theme:
  active: catppuccin-latte

  catppuccin-latte:
    palette: catppuccin-latte
    vivid:   catppuccin-latte
    fish:    static/catppuccin-latte
    bat:     Catppuccin Latte
    wezterm: Catppuccin Latte
    homepage: {theme: light, color: gray}
    nvim:
      plugin:      catppuccin/nvim
      name:        catppuccin
      colorscheme: catppuccin
      opts:        {flavour: latte}

  catppuccin-mocha:
    palette: catppuccin-mocha
    vivid:   catppuccin-mocha
    fish:    static/catppuccin-mocha
    bat:     Catppuccin Mocha
    wezterm: Catppuccin Mocha
    homepage: {theme: dark, color: slate}
    nvim:
      plugin:      catppuccin/nvim
      name:        catppuccin
      colorscheme: catppuccin
      opts:        {flavour: mocha}

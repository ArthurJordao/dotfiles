# yaml-language-server: $schema=../schemas/packages.schema.json
#
# The only place package names are declared. `arch` is keyed by "common" plus
# one key per role name; `darwin` is flat. A darwin entry is a bare string, or
# {name, trusted} — dropping a trust flag makes `brew bundle cleanup --force`
# wipe trust.json.

packages:
  arch:
    common:
      - 1password-cli
      - check-jsonschema
      - chezmoi
      - fish
      - git
      - gnupg
      - go
      - just
      - mosh
      - neovim
      - python-pipx
      - ripgrep
      - shellcheck
      - tailscale
    agent:
      - claude-code
    dev:
      - github-cli
    edge:
      - cloudflared
      - coredns
      - xcaddy-bin
    emulation:
      - syncthing
    gui:
      - 1password
      - firefox
      - qbittorrent
      - ttf-firacode-nerd
    minecraft:
      - jdk21-openjdk
      - jdk25-openjdk
      - tmux
    moonlight:
      - moonlight-qt
    podman:
      # The hosts that publish container ports are the ones that need a
      # firewall; `podman` is the role mars and pluto share and the handhelds
      # do not. check-consistency C24 requires it wherever firewall.yaml has
      # rules.
      - ufw
    samba:
      - avahi
      - samba
      # Windows browses via WSD, not mDNS -- without this mars never appears
      # under Network in Explorer.
      - wsdd
    server:
      - olivetin-bin
      - podman
    sunshine:
      - sunshine
  darwin:
    taps:
      - homebrew/cask-fonts
      - {name: nikitabobko/tap, trusted: true}
      - {name: noborus/tap, trusted: true}
      - {name: osx-cross/arm, trusted: true}
      - {name: osx-cross/avr, trusted: true}
      - {name: qmk/qmk, trusted: true}
      - {name: sst/tap, trusted: true}
      - {name: unisonweb/unison, trusted: true}
    brews:
      - act
      - glib
      - xz
      - gcc
      - harfbuzz
      - python@3.12
      - webp
      - pillow
      - aider
      - jpeg-xl
      - aom
      - boost
      - avrdude
      - python@3.13
      - awscli
      - caddy
      - check-jsonschema
      - dnsmasq
      - libssh2
      - libgit2
      - bat
      - node
      - chezmoi
      - pango
      - librsvg
      - chafa
      - openjdk
      - clojure
      - folly
      - fizz
      - wangle
      - fbthrift
      - fb303
      - edencommon
      - erlang
      - elixir
      - exiftool
      - fd
      - unbound
      - gnutls
      - libass
      - librist
      - tesseract
      - ffmpeg
      - fish
      - fzf
      - gemini-cli
      - gh
      - ghcup
      - git
      - rebar3
      - gleam
      - gnu-sed
      - gnupg
      - go
      - grep
      - hugo
      - libheif
      - libraw
      - imagemagick
      - jless
      - jq
      - just
      - lazygit
      - lesspipe
      - librdkafka
      - libxmlsec1
      - luarocks
      - luv
      - markdown
      - mosh
      - tree-sitter
      - neovim
      - oath-toolkit
      - openldap
      - ormolu
      - pass
      - pass-otp
      - pinentry-mac
      - pipx
      - postgresql@17
      - ripgrep
      - sevenzip
      - shellcheck
      - tree-sitter-cli
      - vivid
      - watchman
      - yazi
      - yozefu
      - zig
      - zk
      - noborus/tap/trdsql
      - qmk/qmk/qmk
      - {name: sst/tap/opencode, trusted: true}
      - unisonweb/unison/unison-language
      - {name: nikhil1raghav/tap/kindle-send, trusted: true}
    casks:
      - 1password
      - aerospace
      - anki
      - claude
      - firefox
      - font-fira-code-nerd-font
      - gimp
      - keybase
      - moonlight
      - ngrok
      - obs
      - obsidian
      - opcode
      - qmk-toolbox
      - raycast
      - signal
      - steam
      - tableplus
      - vial
      - wezterm
      - whatsapp
      - zed
      - prismlauncher
      - slack
      - 1password-cli
    go:
      - github.com/mightymoud/sidekick
  debian:
    common:
      - curl
      - fish
      - git
      - jq
      - just
      - rsync
      - fzf
      # `just check` runs on every managed host and check-shell needs this.
      # Common rather than role-gated, matching packages.arch.
      - shellcheck
      # Not in Debian's archive; install-packages.sh adds the repo.
      - tailscale
      # Installs the `pipx` list below.
      - pipx
    # PyPI tools with no Debian package. Not a role key -- the installer reads
    # this list separately from the common/role groups. pipx rather than pip
    # because Debian's python is externally-managed and refuses a global
    # install. Arch and darwin both package check-jsonschema natively.
    pipx:
      - check-jsonschema
    edge:
      - cloudflared
      # Pinned, and it provides no /usr/bin/go -- the caddy build puts
      # /usr/lib/go-1.27/bin on PATH itself. From trixie-backports.
      - golang-1.27-go
      - openssl
    emulation:
      - syncthing
    podman:
      - aardvark-dns
      - nftables
      - passt
      - podman
      - ufw
      - uidmap
    # Not `common`: phobos is the other debian host and reads SMART off nothing.
    # check-disk.service is the consumer, and the bridge needs `smartctl -d sat`.
    server:
      - smartmontools

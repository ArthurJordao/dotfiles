# yaml-language-server: $schema=../schemas/firewall.schema.json
#
# ufw rulesets, applied only by `just firewall`. Keyed by host: a firewall is
# about one box's exposure, and every plausible role over-matches.
#
# ORDER IS SIGNIFICANT -- ufw is first-match and the list is applied top to
# bottom, which is why the ruleset is rebuilt rather than patched. ssh is not
# declared here; the script emits it first.
#
# {lan_cidr} is substituted at render time. 100.64.0.0/10 is the tailnet.

firewall:
  mars:
    # Both exemptions must precede the limit. 25565 is the only forwarded port.
    - {rule: "allow from {lan_cidr} to any port 25565 proto tcp", comment: "minecraft: LAN exempt"}
    - {rule: "allow from 100.64.0.0/10 to any port 25565 proto tcp", comment: "minecraft: tailscale exempt"}
    - {rule: "limit 25565/tcp", comment: "minecraft: rate-limit external joins"}
    - {rule: "allow 9987/udp", comment: "teamspeak3 voice"}
    - {rule: "allow 10011/tcp", comment: "teamspeak3 serverquery"}
    - {rule: "allow 30033/tcp", comment: "teamspeak3 filetransfer"}
    - {rule: "allow 10400:10401/udp", comment: "steam link / VR"}
    - {rule: "allow from {lan_cidr} to any port 27031", comment: "steam remote play"}
    - {rule: "allow from {lan_cidr} to any port 60000:61000 proto udp", comment: "mosh"}
    # Accepts every port, so nothing narrower matches below it.
    - {rule: "allow from {lan_cidr}", comment: "LAN blanket accept"}
    - {rule: "allow in on tailscale0 to any port 60000:61000 proto udp", comment: "mosh over tailscale"}
    - {rule: "allow in on tailscale0 to any port 445 proto tcp", comment: "samba over tailscale"}

  # navidrome 4533, slskd 5030, soulsync 8008 and coredns 8053 listen on the
  # wildcard address and are closed on purpose: clients reach them through
  # Caddy, which connects over loopback. 5355 is LLMNR, which nothing uses.
  # slskd's peer port 50300 is closed too: the router has never forwarded it, so
  # a rule here would be inert. Opening it takes both -> [[slskd]] in the notes.
  pluto:
    - {rule: "allow from {lan_cidr} to any port 53", comment: "coredns: the LAN"}
    - {rule: "allow from 100.64.0.0/10 to any port 53", comment: "coredns: the tailnet"}
    - {rule: "allow from {lan_cidr} to any port 80,443 proto tcp", comment: "caddy: the LAN"}
    - {rule: "allow from 100.64.0.0/10 to any port 80,443 proto tcp", comment: "caddy: the tailnet"}
    - {rule: "allow from {lan_cidr} to any port 443 proto udp", comment: "caddy HTTP/3: the LAN"}
    - {rule: "allow from 100.64.0.0/10 to any port 443 proto udp", comment: "caddy HTTP/3: the tailnet"}
    # Peers are on the internet, so this cannot be narrowed.
    - {rule: "allow 41641/udp", comment: "tailscale: direct peer connections"}

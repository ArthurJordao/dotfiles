# yaml-language-server: $schema=../schemas/secrets.schema.json
#
# 1Password coordinates. Field names are not declared — templates read them off
# the item. Every field of `shell` becomes an exported var on every host.
#
# Keys are identity-mapped to item titles: the key is what a template writes,
# the value is the title in 1Password. A hyphenated key needs `index`, since a
# hyphen in a field lookup parses as minus.
secrets:
  vault: dotfiles
  items:
    caddy: caddy
    fish: dotfiles-secrets
    gpg-key: gpg-key
    immich: immich
    mars: mars-secrets
    shell: shell
    slskd: slskd
    ssh-ed25519: ssh-ed25519
    ssh-rsa: ssh-rsa

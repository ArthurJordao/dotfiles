# yaml-language-server: $schema=../schemas/secrets.schema.json
#
# 1Password coordinates. Field names are not declared — templates read them off
# the item. Every field of `work-api-keys` becomes an exported var on a `work` host.
#
# Keys are identity-mapped to item titles: the key is what a template writes,
# the value is an object naming the item (`item_name`) and, optionally, the
# vault holding it when that differs from the default below. A hyphenated key
# needs `index`, since a hyphen in a field lookup parses as minus.
secrets:
  items:
    caddy: {item_name: caddy, vault: dotfiles}
    cloudflare-ddns: {item_name: cloudflare-ddns, vault: dotfiles}
    cloudflared: {item_name: cloudflared, vault: dotfiles}
    olivetin: {item_name: olivetin, vault: dotfiles}
    samba: {item_name: samba, vault: turisa}
    silverbullet: {item_name: silverbullet, vault: dotfiles}
    slskd: {item_name: slskd, vault: dotfiles}
    ssh-ed25519: {item_name: ssh-ed25519, vault: dotfiles}
    ssh-rsa: {item_name: ssh-rsa, vault: dotfiles}
    wallabag: {item_name: wallabag, vault: dotfiles}
    work-api-keys: {item_name: work-api-keys, vault: dotfiles}

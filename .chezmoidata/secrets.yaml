# yaml-language-server: $schema=../schemas/secrets.schema.json
#
# 1Password coordinates. Field names are not declared — templates read them off
# the item. Every field of `work-api-keys` becomes an exported var on a `work` host.
#
# Keys are identity-mapped to item titles: the key is what a template writes,
# the value is an object naming the item (`item_name`) and, optionally, the
# vault holding it when that differs from the default below. A hyphenated key
# needs `index`, since a hyphen in a field lookup parses as minus.
secrets:
  vault: dotfiles
  items:
    caddy: {item_name: caddy}
    cloudflare-ddns: {item_name: cloudflare-ddns}
    cloudflared: {item_name: cloudflared}
    gpg-key: {item_name: gpg-key}
    olivetin: {item_name: olivetin}
    samba: {item_name: samba, vault: Conexão astral}
    silverbullet: {item_name: silverbullet}
    slskd: {item_name: slskd}
    ssh-ed25519: {item_name: ssh-ed25519}
    ssh-rsa: {item_name: ssh-rsa}
    wallabag: {item_name: wallabag}
    work-api-keys: {item_name: work-api-keys}

# yaml-language-server: $schema=../schemas/binaries.schema.json
#
# Binaries installed from an upstream release rather than a package manager --
# the only place their versions are pinned. Keyed by distro, then by group:
# "common" plus one key per role name, the same shape as packages.arch.
#
# The versions render into run_onchange_after_10-install-packages.sh.tmpl, so a
# bump here changes that script's hash and the bump IS the upgrade. No
# fingerprint on this file is needed -- do not add one.
#
# `tag` and `asset` take {version}, {arch} and {machine}. Arch is resolved on the
# host (dpkg --print-architecture), machine is `uname -m` -- Rust releases name
# their assets aarch64/x86_64 rather than arm64/amd64. Either way one
# declaration serves both.
#
# install:
#   deb          fetch the .deb, dpkg -i; version comes from dpkg-query
#   tarball      fetch, extract `name`, install -m755 into /usr/bin
#   local-build  run `build` here, then install -m755 into /usr/bin. `toolchain`
#                names the compiler package, which must be declared in
#                packages.yaml (check-consistency C22). Never during an apply --
#                it takes minutes; `just binaries-build` is what asks for it
#   manual       never installed -- pinned and reported only

binaries:
  debian:
    edge:
      # Built, never fetched: the release binaries carry no Cloudflare DNS
      # provider, and without it Caddy cannot answer the DNS-01 challenge and
      # every certificate fails to issue. ~7 minutes on pluto.
      - name: caddy
        repo: caddyserver/caddy
        version: "2.11.4"
        install: local-build
        toolchain: golang-1.27-go
        build: "xcaddy build v{version} --with github.com/caddy-dns/cloudflare"
        tag: "v{version}"
        version_cmd: "caddy version"
        restart: "sudo systemctl restart caddy"
      - name: xcaddy
        repo: caddyserver/xcaddy
        version: "0.4.7"
        install: deb
        tag: "v{version}"
        asset: "xcaddy_{version}_linux_{arch}.deb"
      - name: coredns
        repo: coredns/coredns
        version: "1.14.7"
        install: tarball
        tag: "v{version}"
        asset: "coredns_{version}_linux_{arch}.tgz"
        version_cmd: "coredns --version"
        restart: "sudo systemctl restart coredns"
    server:
      # The .deb installs /usr/local/bin/OliveTin -- capitalised, and not on
      # /usr/bin. olivetin.service already renders that path for debian.
      - name: olivetin
        repo: OliveTin/OliveTin
        version: "3000.19.0"
        install: deb
        tag: "{version}"
        asset: "OliveTin_linux_{arch}.deb"
        restart: "systemctl --user restart olivetin"
      # Runs pdf2epub's PEP 723 script: it resolves pymupdf4llm into its own
      # cache, so nothing is installed into Debian's externally-managed python.
      - name: uv
        repo: astral-sh/uv
        version: "0.12.17"
        install: tarball
        tag: "{version}"
        asset: "uv-{machine}-unknown-linux-gnu.tar.gz"
        version_cmd: "uv --version"

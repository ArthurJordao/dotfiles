# yaml-language-server: $schema=../schemas/dashboard.schema.json
#
# Presentation, logins and buttons for OliveTin. The fifth flat list: like
# quadlets/units/endpoints/syncthing.folders, nothing errors when it disagrees
# with reality, so tools/check-consistency C12/C13 cross-reference it.
#
# `tiles` is keyed by ENDPOINT NAME -- the URL comes from hosts.yaml, never from
# here. An endpoint with no entry still gets a plain, ungrouped tile.
dashboard:
  # Keyed by fieldset, then by ENDPOINT NAME -- the URL still comes from
  # hosts.yaml, never from here. Fieldsets render in sorted key order. An
  # endpoint listed in no group still gets a plain tile under "Other", so a new
  # service is never silently missing.
  tiles:
    Books:
      books: {icon: "selfhst:calibre-web", label: Calibre, description: Library}
      shelfmark: {icon: "selfhst:shelfmark", label: Shelfmark, description: Reading sync}

    Infra:
      dash: {icon: "mdi:view-dashboard", label: This dashboard}
      dns: {icon: "selfhst:coredns", label: CoreDNS, description: Split-horizon DNS}
      sunshine: {icon: "selfhst:sunshine", label: Sunshine, description: Game streaming}

    Media:
      immich: {icon: "selfhst:immich", label: Immich, description: Photos}
      music: {icon: "selfhst:navidrome", label: Navidrome, description: Music}
      slskd: {icon: "selfhst:slskd", label: slskd, description: Soulseek}
      soulsync: {icon: "mdi:playlist-music", label: SoulSync}

  users:
    arthur: {group: admins, secret: ARTHUR_PASSWORD_HASH}
    isa: {group: family, secret: ISA_PASSWORD_HASH}

  # Keyed by the Controls fieldset the buttons sit in -- the group is the key,
  # so it cannot name a section that does not exist. Fieldsets render in sorted
  # key order.
  #
  # `shell` is data, never a template, so OliveTin's own {{ arg }} placeholders
  # are written literally here. `role` keeps an action off hosts that lack it.
  actions:
    Gaming mode:
      - {title: Gaming mode on, icon: "mdi:gamepad-variant", shell: gaming-mode on, timeout: 180, confirm: true, family: true}
      - {title: Gaming mode off, icon: "mdi:server", shell: gaming-mode off, timeout: 180, family: true}
      - {title: Gaming mode status, icon: "mdi:information", shell: gaming-mode status, timeout: 15, family: true, popup: true}

    Minecraft:
      # `use` implicitly stops the others (instances are mutually exclusive) and
      # syncs the enabled unit, so the right server returns after a reboot.
      - title: Start Minecraft server
        role: minecraft
        icon: "mdi:minecraft"
        shell: "minecraft use {{ instance }}"
        timeout: 120
        family: true
        argument: {name: instance, title: Server, choices_from: minecraft-instances}
      - {title: Stop Minecraft server, role: minecraft, icon: "mdi:stop", shell: minecraft stop, timeout: 120, family: true}
      - {title: Minecraft status, role: minecraft, icon: "mdi:information", shell: minecraft status, timeout: 15, family: true, popup: true}

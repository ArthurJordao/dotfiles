# yaml-language-server: $schema=../schemas/dashboard.schema.json
#
# Presentation, logins and buttons for OliveTin. The fifth flat list: like
# quadlets/units/endpoints/syncthing.folders, nothing errors when it disagrees
# with reality, so tools/check-consistency C12/C13 cross-reference it.
#
# `tiles` is keyed by ENDPOINT NAME -- the URL comes from hosts.yaml, never from
# here. An endpoint with no entry still gets a plain, ungrouped tile.
#
# Two dashboards render these: OliveTin and homepage, both through
# .chezmoitemplates/dashboard-tiles.
dashboard:
  # Keyed by fieldset, then by ENDPOINT NAME -- the URL still comes from
  # hosts.yaml, never from here. Fieldsets render in sorted key order. An
  # endpoint listed in no group still gets a plain tile under "Other", so a new
  # service is never silently missing.
  #
  # `container` is what homepage reads state and CPU/memory from. It is a
  # coordinate, not derivable: `books` is `systemd-calibre-web-automated`, and
  # podman only prefixes `systemd-` where the quadlet sets no ContainerName.
  # Omit it for anything that is not a container.
  tiles:
    Books:
      books: {icon: "selfhst:calibre-web", label: Calibre, description: Library, container: systemd-calibre-web-automated}
      shelfmark: {icon: "selfhst:shelfmark", label: Shelfmark, description: Reading sync, container: systemd-shelfmark}
      wallabag: {icon: "selfhst:wallabag", label: wallabag, description: Read later, container: systemd-wallabag}

    Games:
      # No port, so nothing links to it -- the widget is the whole point.
      minecraft: {icon: "mdi:minecraft", label: Minecraft, description: Game server,
                  widget: {type: minecraft, scheme: udp, port: 25565}}
      sunshine: {icon: "selfhst:sunshine", label: Sunshine, description: Game streaming}

    Infra:
      dash: {icon: "mdi:view-dashboard", label: OliveTin, description: Controls}
      home: {icon: "selfhst:homepage", label: Homepage, description: Service overview, container: systemd-homepage}
      dns: {icon: "selfhst:coredns", label: CoreDNS, description: Split-horizon DNS}

    Notes:
      notes: {icon: "mdi:notebook-outline", label: SilverBullet, description: Notes, container: systemd-silverbullet}

    Media:
      music: {icon: "selfhst:navidrome", label: Navidrome, description: Music, container: navidrome}
      slskd: {icon: "selfhst:slskd", label: slskd, description: Soulseek, container: slskd}
      soulsync: {icon: "mdi:playlist-music", label: SoulSync, container: systemd-soulsync}

  users:
    arthur: {group: admins, secret: ARTHUR_PASSWORD_HASH}
    isa: {group: family, secret: ISA_PASSWORD_HASH}

  # Status shown at the top of a Controls fieldset, beside the buttons that
  # change it. Keys match `actions`; `field` names come from dashboard-status,
  # which also emits a <field>_color for each.
  # Only fields for services on the dashboard's own host: dashboard-status
  # probes locally, so a widget for another host would report confident
  # nonsense. The `on:` buttons answer for mars accurately, on demand.
  status:
    Server:
      - {field: failed, label: Failed units, icon: "mdi:alert-circle"}
      - {field: root, label: "/", icon: "mdi:harddisk"}

  # Keyed by the Controls fieldset the buttons sit in -- the group is the key,
  # so it cannot name a section that does not exist. Fieldsets render in sorted
  # key order.
  #
  # `shell` is data, never a template, so OliveTin's own {{ arg }} placeholders
  # are written literally here. `on` runs the action over ssh on that host.
  actions:
    DNS:
      - {title: Ad blocking status, icon: "mdi:shield-check", shell: blocky status, timeout: 15, family: true, popup: true}
      - {title: Pause ad blocking, icon: "mdi:shield-off", shell: blocky pause 5m, timeout: 15, family: true, popup: true}
      - {title: Resume ad blocking, icon: "mdi:shield-check", shell: blocky resume, timeout: 15, family: true, popup: true}
      - {title: Ad blocking stats, icon: "mdi:chart-box", shell: blocky stats, timeout: 15, family: true, popup: true}
      - {title: Recently blocked, icon: "mdi:dns", shell: blocky blocked, timeout: 15, popup: true}
      - title: Why is this blocked?
        icon: "mdi:help-circle"
        shell: "blocky why {{ domain }}"
        timeout: 15
        popup: true
        argument: {name: domain, title: Domain, type: ascii_identifier}
      - {title: Refresh blocklists, icon: "mdi:refresh", shell: blocky refresh, timeout: 300, popup: true}

    Gaming mode:
      - {title: Gaming mode on, on: mars, icon: "mdi:gamepad-variant", shell: gaming-mode on, timeout: 180, confirm: true, family: true}
      - {title: Gaming mode off, on: mars, icon: "mdi:server", shell: gaming-mode off, timeout: 180, family: true}
      # The widget is a minute stale at worst; this is the authoritative answer,
      # and it names the units gaming mode stopped.
      - {title: Gaming mode status, on: mars, icon: "mdi:information", shell: gaming-mode status, timeout: 15, family: true, popup: true}

    Minecraft:
      # `use` implicitly stops the others (instances are mutually exclusive) and
      # syncs the enabled unit, so the right server returns after a reboot.
      - title: Start Minecraft server
        on: mars
        icon: "mdi:minecraft"
        shell: "minecraft use {{ instance }}"
        timeout: 120
        family: true
        argument: {name: instance, title: Server, choices_from: minecraft-instances}
      - {title: Stop Minecraft server, on: mars, icon: "mdi:stop", shell: minecraft stop, timeout: 120, family: true}
      # Also reports which instance is enabled at boot, which the widget omits.
      - {title: Minecraft status, on: mars, icon: "mdi:information", shell: minecraft status, timeout: 15, family: true, popup: true}
      # The timer runs this daily; the button is for "before I install a mod".
      - {title: Backup Minecraft now, on: mars, icon: "mdi:content-save", shell: "systemctl --user start minecraft-backup.service && journalctl --user -u minecraft-backup.service -n 20 --no-pager", timeout: 900, confirm: true, family: true, popup: true}

    Server:
      # The timer runs hourly; the button is for "before I do something drastic".
      - {title: Back up notes now, icon: "mdi:content-save-cog", shell: "systemctl --user start notes-backup.service && journalctl --user -u notes-backup.service -n 10 --no-pager", timeout: 120, popup: true}
      - {title: Disk space, icon: "mdi:harddisk", shell: "df -h /", timeout: 15, family: true, popup: true}
      # check-live reads gaming-mode's state file, so a stopped stack reports as
      # intentional rather than as drift.
      - {title: Stack health, icon: "mdi:heart-pulse", shell: check-live, timeout: 120, popup: true}
      - {title: Uptime, icon: "mdi:speedometer", shell: "uptime && free -h", timeout: 15, family: true, popup: true}
      # The timer already does this; the button is "pull now". It restarts
      # whatever it updates, hence the confirmation.
      - {title: Update containers, icon: "mdi:update", shell: "systemctl --user start podman-auto-update.service && journalctl --user -u podman-auto-update.service -n 30 --no-pager", timeout: 600, confirm: true, popup: true}

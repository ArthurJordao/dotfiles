# yaml-language-server: $schema=../schemas/dashboard.schema.json
#
# Presentation, logins and buttons for OliveTin. The fifth flat list: like
# quadlets/units/endpoints/syncthing.folders, nothing errors when it disagrees
# with reality, so tools/check-consistency C12/C13 cross-reference it.
#
# `tiles` is keyed by ENDPOINT NAME -- the URL comes from hosts.yaml, never from
# here. An endpoint with no entry still gets a plain, ungrouped tile.
dashboard:
  groups: [Media, Books, Infra]

  tiles:
    books: {icon: "selfhst:calibre-web", group: Books, label: Calibre, description: Library}
    dash: {icon: "mdi:view-dashboard", group: Infra, label: This dashboard}
    dns: {icon: "selfhst:coredns", group: Infra, label: CoreDNS, description: Split-horizon DNS}
    immich: {icon: "selfhst:immich", group: Media, label: Immich, description: Photos}
    music: {icon: "selfhst:navidrome", group: Media, label: Navidrome, description: Music}
    shelfmark: {icon: "selfhst:shelfmark", group: Books, label: Shelfmark, description: Reading sync}
    slskd: {icon: "selfhst:slskd", group: Media, label: slskd, description: Soulseek}
    soulsync: {icon: "mdi:playlist-music", group: Media, label: SoulSync}
    sunshine: {icon: "selfhst:sunshine", group: Infra, label: Sunshine, description: Game streaming}

  users:
    arthur: {group: admins, secret: ARTHUR_PASSWORD_HASH}
    isa: {group: family, secret: ISA_PASSWORD_HASH}

  action_groups: [Gaming mode, Minecraft]

  # `shell` is data, never a template, so OliveTin's own {{ arg }} placeholders
  # are written literally here. `role` keeps an action off hosts that lack it.
  actions:
    - {title: Gaming mode on, group: Gaming mode, icon: "mdi:gamepad-variant", shell: gaming-mode on, timeout: 180, confirm: true, family: true}
    - {title: Gaming mode off, group: Gaming mode, icon: "mdi:server", shell: gaming-mode off, timeout: 180, family: true}
    - {title: Gaming mode status, group: Gaming mode, icon: "mdi:information", shell: gaming-mode status, timeout: 15, family: true, popup: true}
    # `use` implicitly stops the others (instances are mutually exclusive) and
    # syncs the enabled unit, so the right server returns after a reboot.
    - title: Start Minecraft server
      group: Minecraft
      role: minecraft
      icon: "selfhst:minecraft"
      shell: "minecraft use {{ instance }}"
      timeout: 120
      family: true
      argument: {name: instance, title: Server, choices_from: minecraft-instances}
    - {title: Stop Minecraft server, group: Minecraft, role: minecraft, icon: "mdi:stop", shell: minecraft stop, timeout: 120, family: true}
    - {title: Minecraft status, group: Minecraft, role: minecraft, icon: "mdi:information", shell: minecraft status, timeout: 15, family: true, popup: true}

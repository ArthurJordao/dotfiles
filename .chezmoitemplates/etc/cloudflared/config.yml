{{- $domain := .domain -}}
{{- $tunnel := .cloudflare.tunnel_id -}}
# GENERATED from .chezmoidata/hosts.yaml — set `public: true` on an endpoint there.
tunnel: {{ $tunnel }}
# Rendered from 1Password by run_onchange_after_70-deploy-etc, beside this file.
# A home directory would tie a root-run unit to whichever user holds `edge`.
credentials-file: /etc/cloudflared/{{ $tunnel }}.json
# quic flaps on pluto's network ("timeout: no recent network activity" every
# ~5min, tunnel connections drop and reconnect) — http2 is stable there.
protocol: http2

# Public ingress via Cloudflare Tunnel — no open ports. LAN/Tailscale clients
# still resolve via CoreDNS, so these routes only affect outside traffic.
# Each hostname needs its public CNAME created once:
#   cloudflared tunnel route dns <tunnel-id> <hostname>
#
# 127.0.0.1, not localhost — rootless pasta containers only forward IPv4.
ingress:
{{- range $hostname, $host := .hosts }}
{{- range (index $host "endpoints" | default list) }}
{{- if and (hasKey . "port") (index . "public" | default false) }}
  - hostname: {{ .name }}.{{ $domain }}
{{- if eq (index . "auth" | default "") "bearer" }}
    # Via Caddy, not the app port: Caddy is where the bearer token is checked.
    service: https://127.0.0.1:443
    originRequest:
      originServerName: {{ .name }}.{{ $domain }}
{{- else }}
    service: http://127.0.0.1:{{ .port }}
{{- end }}
{{- end }}{{ end }}{{ end }}
  - service: http_status:404

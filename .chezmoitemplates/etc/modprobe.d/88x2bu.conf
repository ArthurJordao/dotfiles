# rtw_power_mgnt=0       no wifi power saving (stability over idle draw)
# rtw_enusbss=0          no USB selective suspend
# rtw_ips_mode=0         no inactive power save
# rtw_switch_usb_mode=1  negotiate USB 3.0; without it the adapter sits at 480M
options 88x2bu rtw_power_mgnt=0 rtw_enusbss=0 rtw_ips_mode=0 rtw_switch_usb_mode=1

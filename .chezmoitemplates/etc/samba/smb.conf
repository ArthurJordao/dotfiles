{{- $x9pro := includeTemplate "storage-path" (dict "hosts" .hosts "name" "x9pro") -}}
{{- $user := (index .hosts .hostname).user -}}
# Generated by chezmoi from .chezmoitemplates/etc/samba/smb.conf -- do not edit.

[global]
   workgroup = WORKGROUP
   server string = {{ .hostname }}
   server role = standalone server

   # Floor the dialect at SMB3. Windows 11 and macOS both speak it.
   server min protocol = SMB3
   # No anonymous access: every session authenticates.
   map to guest = never

   # LAN and tailnet only. Deliberately no `bind interfaces only`: tailscale0
   # may not exist when smbd starts, and Samba would then never listen on the
   # tailnet until a reload. The host firewall is unmanaged state on mars and
   # is not a guarantee this repo makes.
   hosts allow = {{ .lan_cidr }} 100.64.0.0/10 fd7a:115c:a1e0::/48 127.0.0.1 ::1
   hosts deny = 0.0.0.0/0 ::/0

   # No printing: it would pull in CUPS and advertise nothing we have.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   log file = /var/log/samba/%m.log
   max log size = 1000

[x9pro]
   comment = x9pro external drive
   path = {{ $x9pro }}
   browseable = yes
   read only = no
   valid users = {{ $user }}
